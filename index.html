<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قيادة سيارة حقيقية GLB - Three.js</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            background: #090d16;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #hud {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 20;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 14px 18px;
            max-width: 360px;
            line-height: 1.65;
            font-size: 0.9rem;
        }
        #status {
            margin-top: 6px;
            color: #38bdf8;
            font-weight: bold;
        }
        .hint {
            margin-top: 8px;
            font-size: 0.78rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div><b>محاكي سيارة بنموذج ثلاثي الأبعاد (`car.glb`)</b></div>
        <div id="status">جاري البحث عن ملف car.glb...</div>
        <div>التحكم: <b>W A S D</b> أو الأسهم للقيادة | <b>Space</b> للفرملة</div>
        <div class="hint">
            ملاحظة: ضع ملف النموذج باسم <b>car.glb</b> في نفس المجلد وشغّل الصفحة عبر خادم محلي أو استضافة.
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);
        scene.fog = new THREE.FogExp2(0x0f172a, 0.003);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;
        document.body.appendChild(renderer.domElement);

        // بيئة انعكاسات لظهور الطلاء والزجاج بشكل أوضح
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        const roomEnv = new THREE.RoomEnvironment();
        scene.environment = pmremGenerator.fromScene(roomEnv, 0.04).texture;
        roomEnv.dispose();
        pmremGenerator.dispose();

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(20, 35, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.set(2048, 2048);
        scene.add(dirLight);

        // أرضية طريق مع خطوط وسطية
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(1200, 1200),
            new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85, metalness: 0.05 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const road = new THREE.Mesh(
            new THREE.PlaneGeometry(14, 1200),
            new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.9 })
        );
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.01;
        road.receiveShadow = true;
        scene.add(road);

        const lineMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
        for (let z = -580; z <= 580; z += 12) {
            const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 4), lineMat);
            dash.rotation.x = -Math.PI / 2;
            dash.position.set(0, 0.02, z);
            scene.add(dash);
        }

        const carRig = new THREE.Group();
        scene.add(carRig);

        const statusEl = document.getElementById('status');
        const loader = new THREE.GLTFLoader();

        loader.load(
            'car.glb',
            (gltf) => {
                const model = gltf.scene;
                model.traverse((node) => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                    }
                });

                // تحجيم النموذج ليطابق أبعاد سيارة متوسطة (~4.1 متر طولاً) وضبطه على الأرض
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const maxSide = Math.max(size.x, size.y, size.z) || 1;
                const scaleFactor = 4.1 / maxSide;
                model.scale.setScalar(scaleFactor);

                const finalBox = new THREE.Box3().setFromObject(model);
                model.position.y = -finalBox.min.y;
                model.position.x = -(finalBox.min.x + finalBox.max.x) * 0.5;
                model.position.z = -(finalBox.min.z + finalBox.max.z) * 0.5;

                carRig.add(model);
                statusEl.textContent = 'تم تحميل النموذج car.glb — جاهز للقيادة';
                statusEl.style.color = '#4ade80';
            },
            undefined,
            () => {
                statusEl.textContent = 'لم يتم العثور على car.glb بعد (ضع الملف بجانب index.html وشغّله عبر خادم محلي).';
                statusEl.style.color = '#f87171';
            }
        );

        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        let speed = 0;
        let steer = 0;

        function animate() {
            requestAnimationFrame(animate);

            const accel = 0.022;
            const maxSpeed = 1.2;
            const maxRev = -0.45;

            if (keys['arrowup'] || keys['w']) {
                speed = Math.min(speed + accel, maxSpeed);
            } else if (keys['arrowdown'] || keys['s']) {
                speed = Math.max(speed - accel, maxRev);
            } else if (keys[' ']) {
                speed *= 0.85;
            } else {
                speed *= 0.96;
            }

            if (Math.abs(speed) < 0.002) speed = 0;

            const turnInput = ((keys['arrowleft'] || keys['a']) ? 1 : 0) - ((keys['arrowright'] || keys['d']) ? 1 : 0);
            steer += (turnInput - steer) * 0.15;

            if (Math.abs(speed) > 0) {
                const dir = speed >= 0 ? 1 : -1;
                carRig.rotation.y += steer * 0.036 * Math.min(1, Math.abs(speed) / 0.35) * dir;
                carRig.position.x += Math.sin(carRig.rotation.y) * speed;
                carRig.position.z += Math.cos(carRig.rotation.y) * speed;
            }

            const desiredCam = new THREE.Vector3(0, 2.5, -6.5).applyMatrix4(carRig.matrixWorld);
            camera.position.lerp(desiredCam, 0.12);

            const lookAtPos = new THREE.Vector3(0, 1.15, 4).applyMatrix4(carRig.matrixWorld);
            camera.lookAt(lookAtPos);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
