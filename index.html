<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clio 4 - Working Traffic Lights 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            overflow: hidden;
            background-color: #090d16;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #hud {
            position: absolute;
            top: 18px;
            left: 18px;
            right: 18px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            gap: 12px;
        }
        .panel {
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 12px 16px;
            border-radius: 12px;
            pointer-events: auto;
        }
        .car-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: #f8fafc;
        }
        .car-sub {
            font-size: 0.76rem;
            color: #94a3b8;
            margin-top: 2px;
        }
        #collision-status {
            font-size: 0.78rem;
            color: #f87171;
            margin-top: 6px;
            min-height: 18px;
            font-weight: bold;
        }
        #signal-status {
            font-size: 0.78rem;
            color: #4ade80;
            margin-top: 4px;
            font-weight: bold;
        }
        .speedometer {
            text-align: center;
            min-width: 124px;
        }
        #speed-val {
            font-size: 1.95rem;
            font-weight: 800;
            color: #38bdf8;
            line-height: 1;
        }
        .speed-unit {
            font-size: 0.75rem;
            color: #cbd5e1;
        }
        #steer-indicator {
            font-size: 0.74rem;
            color: #fbbf24;
            margin-top: 4px;
        }
        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 10px;
        }
        button.action-btn {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 6px 11px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        button.action-btn:hover {
            background: #334155;
        }
        button.action-btn.active {
            background: #0284c7;
            border-color: #38bdf8;
        }
        #instructions {
            position: absolute;
            bottom: 18px;
            left: 18px;
            font-size: 0.78rem;
            color: #cbd5e1;
        }
        #mobile-controls {
            display: none;
            position: absolute;
            bottom: 18px;
            left: 18px;
            right: 18px;
            justify-content: space-between;
            pointer-events: none;
        }
        .touch-group {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }
        .touch-btn {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: rgba(30, 41, 59, 0.82);
            border: 2px solid rgba(255, 255, 255, 0.25);
            color: white;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .touch-btn:active {
            background: rgba(56, 189, 248, 0.65);
            transform: scale(0.95);
        }
        @media (max-width: 768px) {
            #instructions { display: none; }
            #mobile-controls { display: flex; }
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="hud">
    <div class="panel">
        <div class="car-title">Renault Clio IV — Endless US City</div>
        <div class="car-sub">إشارات مرور عاملة، تصادم، مدينة لا تنتهي، ومشاة</div>
        <div id="signal-status">إشارة التقاطع: متزامنة</div>
        <div id="collision-status">جاهز للقيادة</div>
        <div class="controls-bar">
            <button class="action-btn active" id="btn-lights" onclick="toggleLights()">المصابيح: تشغيل</button>
            <button class="action-btn" id="btn-time" onclick="toggleDayNight()">الوضع: ليلي</button>
            <button class="action-btn" id="btn-cam" onclick="switchCamera()">الكاميرا</button>
            <button class="action-btn" onclick="resetCar()">إعادة الضبط</button>
        </div>
    </div>

    <div class="panel speedometer">
        <div id="speed-val">0</div>
        <div class="speed-unit">كم / ساعة</div>
        <div id="steer-indicator">المقود: مستقيم</div>
    </div>
</div>

<div id="instructions" class="panel">
    التحكم: الأسهم أو <b>W A S D</b> للقيادة والانحناء | <b>Space</b> للانجراف/الفرامل | <b>L</b> للمصابيح | <b>C</b> للكاميرا
</div>

<div id="mobile-controls">
    <div class="touch-group">
        <div class="touch-btn" id="btn-right">→</div>
        <div class="touch-btn" id="btn-left">←</div>
    </div>
    <div class="touch-group">
        <div class="touch-btn" id="btn-down">↓</div>
        <div class="touch-btn" id="btn-up">↑</div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // 1. إعداد المشهد والكاميرا والمصيّر
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const nightBg = 0x090e1a;
    const dayBg = 0x7dd3fc;

    scene.background = new THREE.Color(nightBg);
    scene.fog = new THREE.FogExp2(nightBg, 0.004);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1200);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // 2. الإضاءة
    const ambientLight = new THREE.AmbientLight(0x52607a, 0.95);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xe2e8f0, 0.95);
    dirLight.position.set(50, 90, 40);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 10;
    dirLight.shadow.camera.far = 300;
    const shadowBound = 110;
    dirLight.shadow.camera.left = -shadowBound;
    dirLight.shadow.camera.right = shadowBound;
    dirLight.shadow.camera.top = shadowBound;
    dirLight.shadow.camera.bottom = -shadowBound;
    scene.add(dirLight, dirLight.target);

    // 3. الأرضية والمدينة اللانهائية
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(2400, 2400),
        new THREE.MeshStandardMaterial({ color: 0x0b101b, roughness: 0.92 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const yellowLineMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
    const whiteLineMat = new THREE.MeshBasicMaterial({ color: 0xf8fafc });
    const asphaltMat = new THREE.MeshStandardMaterial({ color: 0x1e2430, roughness: 0.78 });
    const curbMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.7 });
    const poleMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.7 });
    const lampBulbMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
    const buildingPalette = [0x243044, 0x2d3748, 0x1e293b, 0x334155, 0x293548];
    const trimMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.5, metalness: 0.3 });
    const litWindowMat = new THREE.MeshBasicMaterial({ color: 0xfde68a });
    const darkWindowMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2, metalness: 0.6 });

    const pedestrianShirts = [0xef4444, 0x3b82f6, 0x10b981, 0xf59e0b, 0xa855f7, 0xec4899];
    const pedestrianPants = [0x1e293b, 0x334155, 0x0f172a, 0x475569];
    const skinTones = [0xf1c27d, 0xe0ac69, 0x8d5524, 0xc68642];

    const TILE_SIZE = 130;
    const GRID_RADIUS = 1;
    const roadWidth = 16;

    const cityTiles = [];
    const trafficLightGroups = [];
    const pedestrians = [];
    const buildingWindows = [];
    const buildingBoxes = [];

    function createRoadStrip(length, rotY) {
        const strip = new THREE.Group();

        const road = new THREE.Mesh(new THREE.PlaneGeometry(roadWidth, length), asphaltMat);
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.02;
        road.receiveShadow = true;
        strip.add(road);

        const doubleYellowGeo = new THREE.PlaneGeometry(0.16, length - 18);
        const yLeft = new THREE.Mesh(doubleYellowGeo, yellowLineMat);
        yLeft.rotation.x = -Math.PI / 2;
        yLeft.position.set(-0.18, 0.035, 0);

        const yRight = new THREE.Mesh(doubleYellowGeo, yellowLineMat);
        yRight.rotation.x = -Math.PI / 2;
        yRight.position.set(0.18, 0.035, 0);
        strip.add(yLeft, yRight);

        const laneDashGeo = new THREE.PlaneGeometry(0.18, 3.2);
        [-roadWidth / 4, roadWidth / 4].forEach(laneX => {
            for (let i = -length / 2 + 16; i < length / 2 - 16; i += 10.5) {
                const dash = new THREE.Mesh(laneDashGeo, whiteLineMat);
                dash.rotation.x = -Math.PI / 2;
                dash.position.set(laneX, 0.032, i);
                strip.add(dash);
            }
        });

        const edgeGeo = new THREE.PlaneGeometry(0.2, length - 16);
        [-roadWidth / 2 + 0.45, roadWidth / 2 - 0.45].forEach(edgeX => {
            const edge = new THREE.Mesh(edgeGeo, whiteLineMat);
            edge.rotation.x = -Math.PI / 2;
            edge.position.set(edgeX, 0.03, 0);
            strip.add(edge);
        });

        const curbGeo = new THREE.BoxGeometry(0.65, 0.24, length - 16);
        const leftCurb = new THREE.Mesh(curbGeo, curbMat);
        leftCurb.position.set(-roadWidth / 2 - 0.32, 0.12, 0);
        leftCurb.receiveShadow = true;

        const rightCurb = leftCurb.clone();
        rightCurb.position.x = roadWidth / 2 + 0.32;
        strip.add(leftCurb, rightCurb);

        strip.rotation.y = rotY;
        return strip;
    }

    function createDetailedBuilding(w, h, d, colorHex, seed) {
        const bGroup = new THREE.Group();

        const body = new THREE.Mesh(
            new THREE.BoxGeometry(w, h, d),
            new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.75, metalness: 0.15 })
        );
        body.position.y = h / 2;
        body.castShadow = true;
        body.receiveShadow = true;
        bGroup.add(body);

        const cornice = new THREE.Mesh(new THREE.BoxGeometry(w + 0.7, 0.55, d + 0.7), trimMat);
        cornice.position.y = h + 0.25;
        cornice.castShadow = true;
        bGroup.add(cornice);

        const basePlinth = new THREE.Mesh(new THREE.BoxGeometry(w + 0.4, 1.4, d + 0.4), trimMat);
        basePlinth.position.y = 0.7;
        bGroup.add(basePlinth);

        const floors = Math.floor((h - 3.5) / 3.4);
        const cols = Math.max(2, Math.floor((w - 4) / 3.6));
        const winGeo = new THREE.PlaneGeometry(1.3, 1.65);

        for (let f = 0; f < floors; f++) {
            const wy = 2.8 + f * 3.4;
            for (let c = 0; c < cols; c++) {
                const wx = -((cols - 1) * 3.2) / 2 + c * 3.2;
                const isLit = ((seed * 13 + f * 7 + c * 5) % 4) !== 0;
                const mat = isLit ? litWindowMat : darkWindowMat;

                const frontWin = new THREE.Mesh(winGeo, mat);
                frontWin.position.set(wx, wy, d / 2 + 0.04);
                bGroup.add(frontWin);

                const backWin = new THREE.Mesh(winGeo, mat);
                backWin.position.set(wx, wy, -d / 2 - 0.04);
                backWin.rotation.y = Math.PI;
                bGroup.add(backWin);

                buildingWindows.push({ mesh: frontWin, isLit });
                buildingWindows.push({ mesh: backWin, isLit });
            }
        }

        return bGroup;
    }

    function createPedestrian(shirtColor, pantsColor, skinColor) {
        const person = new THREE.Group();
        const shirtMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.7 });
        const pantsMat = new THREE.MeshStandardMaterial({ color: pantsColor, roughness: 0.8 });
        const skinMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.55 });
        const shoeMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.7 });

        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.62, 0.24), shirtMat);
        torso.position.y = 1.05;
        torso.castShadow = true;
        person.add(torso);

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.17, 14, 14), skinMat);
        head.position.y = 1.55;
        head.castShadow = true;
        person.add(head);

        function makeLimbPivot(x, y, w, h, mat, hasShoe = false) {
            const pivot = new THREE.Group();
            pivot.position.set(x, y, 0);
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), mat);
            mesh.position.y = -h / 2;
            mesh.castShadow = true;
            pivot.add(mesh);

            if (hasShoe) {
                const shoe = new THREE.Mesh(new THREE.BoxGeometry(w * 1.05, 0.11, 0.28), shoeMat);
                shoe.position.set(0, -h, 0.04);
                shoe.castShadow = true;
                pivot.add(shoe);
            }
            person.add(pivot);
            return pivot;
        }

        const leftLeg = makeLimbPivot(-0.11, 0.74, 0.14, 0.72, pantsMat, true);
        const rightLeg = makeLimbPivot(0.11, 0.74, 0.14, 0.72, pantsMat, true);
        const leftArm = makeLimbPivot(-0.3, 1.32, 0.12, 0.54, shirtMat, false);
        const rightArm = makeLimbPivot(0.3, 1.32, 0.12, 0.54, shirtMat, false);

        return { mesh: person, leftLeg, rightLeg, leftArm, rightArm };
    }

    function createCityTile(seedIndex) {
        const tile = new THREE.Group();
        const localBuildings = [];

        tile.add(createRoadStrip(TILE_SIZE, 0));
        tile.add(createRoadStrip(TILE_SIZE, Math.PI / 2));

        for (let i = -6.5; i <= 6.5; i += 1.3) {
            const stripeNS1 = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 2.2), whiteLineMat);
            stripeNS1.rotation.x = -Math.PI / 2;
            stripeNS1.position.set(i, 0.035, 9.5);

            const stripeNS2 = stripeNS1.clone();
            stripeNS2.position.z = -9.5;

            const stripeEW1 = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 0.55), whiteLineMat);
            stripeEW1.rotation.x = -Math.PI / 2;
            stripeEW1.position.set(9.5, 0.035, i);

            const stripeEW2 = stripeEW1.clone();
            stripeEW2.position.x = -9.5;

            tile.add(stripeNS1, stripeNS2, stripeEW1, stripeEW2);
        }

        // إشارات مرور ثلاثية الألوان تعمل بدورة منظمة (أحمر، أصفر، أخضر)
        const redOnMat = new THREE.MeshBasicMaterial({ color: 0xff2a2a });
        const yellowOnMat = new THREE.MeshBasicMaterial({ color: 0xffd000 });
        const greenOnMat = new THREE.MeshBasicMaterial({ color: 0x16ff6a });

        const redOffMat = new THREE.MeshBasicMaterial({ color: 0x380c0c });
        const yellowOffMat = new THREE.MeshBasicMaterial({ color: 0x3a2e08 });
        const greenOffMat = new THREE.MeshBasicMaterial({ color: 0x083618 });

        const lightUnit = {
            redOnMat, yellowOnMat, greenOnMat,
            redOffMat, yellowOffMat, greenOffMat,
            signals: []
        };

        [[-9.2, -9.2], [9.2, 9.2]].forEach(([cx, cz], idx) => {
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.14, 5.8), poleMat);
            pole.position.set(cx, 2.9, cz);
            pole.castShadow = true;
            tile.add(pole);

            const arm = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.12, 0.12), poleMat);
            arm.position.set(cx + (cx < 0 ? 1.9 : -1.9), 5.6, cz);
            tile.add(arm);

            const box = new THREE.Mesh(new THREE.BoxGeometry(0.38, 1.05, 0.38), poleMat);
            box.position.set(cx + (cx < 0 ? 3.2 : -3.2), 5.15, cz);
            tile.add(box);

            const rBulb = new THREE.Mesh(new THREE.SphereGeometry(0.115, 12, 12), redOnMat);
            rBulb.position.set(box.position.x, 5.48, box.position.z + 0.19);

            const yBulb = new THREE.Mesh(new THREE.SphereGeometry(0.115, 12, 12), yellowOffMat);
            yBulb.position.set(box.position.x, 5.15, box.position.z + 0.19);

            const gBulb = new THREE.Mesh(new THREE.SphereGeometry(0.115, 12, 12), greenOffMat);
            gBulb.position.set(box.position.x, 4.82, box.position.z + 0.19);

            tile.add(rBulb, yBulb, gBulb);
            lightUnit.signals.push({ rBulb, yBulb, gBulb, axis: idx === 0 ? 'z' : 'x' });
        });
        trafficLightGroups.push(lightUnit);

        const quadOffsets = [
            [-36, -36], [36, -36],
            [-36, 36], [36, 36]
        ];

        const bWidth = 28;
        const bDepth = 28;

        quadOffsets.forEach(([qx, qz], qIdx) => {
            const h = 14 + Math.abs(Math.sin((seedIndex + 1) * 1.7 + qIdx)) * 24;
            const colorHex = buildingPalette[(seedIndex + qIdx) % buildingPalette.length];
            const building = createDetailedBuilding(bWidth, h, bDepth, colorHex, seedIndex * 7 + qIdx);
            building.position.set(qx, 0, qz);
            tile.add(building);

            const colliderRecord = {
                localX: qx,
                localZ: qz,
                halfW: bWidth / 2 + 0.4,
                halfD: bDepth / 2 + 0.4,
                worldX: qx,
                worldZ: qz
            };
            buildingBoxes.push(colliderRecord);
            localBuildings.push(colliderRecord);

            const lampPole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.13, 6.6), poleMat);
            const lampX = qx + (qx < 0 ? 26.5 : -26.5);
            const lampZ = qz + (qz < 0 ? 22 : -22);
            lampPole.position.set(lampX, 3.3, lampZ);
            lampPole.castShadow = true;
            tile.add(lampPole);

            const lampBulb = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 0.25), lampBulbMat);
            lampBulb.position.set(lampX + (qx < 0 ? -0.9 : 0.9), 6.55, lampZ);
            tile.add(lampBulb);
        });

        for (let p = 0; p < 4; p++) {
            const shirt = pedestrianShirts[(seedIndex * 4 + p) % pedestrianShirts.length];
            const pants = pedestrianPants[(seedIndex + p) % pedestrianPants.length];
            const skin = skinTones[(seedIndex + p * 2) % skinTones.length];
            const ped = createPedestrian(shirt, pants, skin);

            const sideSign = p % 2 === 0 ? 1 : -1;
            const alongAxis = p >= 2;
            const baseX = alongAxis ? (-18 + (p - 2) * 32) : (sideSign * (roadWidth / 2 + 0.85));
            const baseZ = alongAxis ? (sideSign * (roadWidth / 2 + 0.85)) : (-18 + p * 18);

            ped.mesh.position.set(baseX, 0.22, baseZ);
            tile.add(ped.mesh);

            pedestrians.push({
                ...ped,
                baseX,
                baseZ,
                alongAxis,
                dir: sideSign,
                walkSpeed: 0.024 + (p % 3) * 0.006,
                phase: seedIndex * 1.1 + p * 1.7,
                range: 20,
                hitTimer: 0,
                knockX: 0,
                knockZ: 0
            });
        }

        scene.add(tile);
        return { mesh: tile, localBuildings };
    }

    let tileCounter = 0;
    for (let gx = -GRID_RADIUS; gx <= GRID_RADIUS; gx++) {
        for (let gz = -GRID_RADIUS; gz <= GRID_RADIUS; gz++) {
            const created = createCityTile(tileCounter++);
            const tx = gx * TILE_SIZE;
            const tz = gz * TILE_SIZE;
            created.mesh.position.set(tx, 0, tz);
            created.localBuildings.forEach(b => {
                b.worldX = tx + b.localX;
                b.worldZ = tz + b.localZ;
            });
            cityTiles.push({ mesh: created.mesh, localBuildings: created.localBuildings, gx, gz });
        }
    }

    // 4. سيارة اللاعب Renault Clio 4 البيضاء
    const car = new THREE.Group();
    const carBodyGroup = new THREE.Group();
    car.add(carBodyGroup);

    const whitePaint = new THREE.MeshPhysicalMaterial({
        color: 0xf8fafc,
        metalness: 0.15,
        roughness: 0.2,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1
    });
    const darkGlass = new THREE.MeshPhysicalMaterial({
        color: 0x0f172a,
        metalness: 0.1,
        roughness: 0.1,
        transparent: true,
        opacity: 0.88
    });
    const blackTrim = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.6 });
    const greyDiffuser = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.5, metalness: 0.3 });
    const rimGrey = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.8, roughness: 0.25 });
    const tireRubber = new THREE.MeshStandardMaterial({ color: 0x090d16, roughness: 0.85 });
    const tailLightMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, emissive: 0x991b1b, emissiveIntensity: 1.5 });
    const reverseLightMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, emissive: 0xe2e8f0, emissiveIntensity: 0.0 });
    const headLightMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xe0f2fe, emissiveIntensity: 2.0 });

    const lowerBody = new THREE.Mesh(new THREE.BoxGeometry(1.86, 0.58, 4.06), whitePaint);
    lowerBody.position.set(0, 0.58, 0);
    lowerBody.castShadow = true;
    lowerBody.receiveShadow = true;
    carBodyGroup.add(lowerBody);

    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.58, 0.52, 2.35), whitePaint);
    cabin.position.set(0, 1.08, -0.22);
    cabin.castShadow = true;
    carBodyGroup.add(cabin);

    const frontWindshield = new THREE.Mesh(new THREE.PlaneGeometry(1.48, 0.85), darkGlass);
    frontWindshield.position.set(0, 1.06, 1.08);
    frontWindshield.rotation.x = -Math.PI / 3.1;
    carBodyGroup.add(frontWindshield);

    const rearWindshield = new THREE.Mesh(new THREE.PlaneGeometry(1.42, 0.68), darkGlass);
    rearWindshield.position.set(0, 1.08, -1.45);
    rearWindshield.rotation.x = Math.PI / 3.6;
    rearWindshield.rotation.y = Math.PI;
    carBodyGroup.add(rearWindshield);

    const sideWindowGeo = new THREE.PlaneGeometry(2.05, 0.42);

    const wheels = [];

    function createWheel(x, y, z, isFront, targetGroup = car, wheelArray = wheels) {
        const pivot = new THREE.Group();
        pivot.position.set(x, y, z);

        const wheelMesh = new THREE.Group();
        const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.24, 24), tireRubber);
        tire.rotation.z = Math.PI / 2;
        tire.castShadow = true;
        wheelMesh.add(tire);

        const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.25, 14), rimGrey);
        rim.rotation.z = Math.PI / 2;
        wheelMesh.add(rim);

        for (let i = 0; i < 5; i++) {
            const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.045, 0.42), rimGrey);
            spoke.rotation.x = (i * Math.PI) / 2.5;
            wheelMesh.add(spoke);
        }

        pivot.add(wheelMesh);
        targetGroup.add(pivot);
        wheelArray.push(wheelMesh);
        if (isFront && targetGroup === car) frontWheelPivots.push(pivot);
    }

    createWheel(0.86, 0.34, 1.28, true);
    createWheel(-0.86, 0.34, 1.28, true);

    // 5. سيارات أخرى تسير في الطريق
    const trafficColors = [0xef4444, 0x2563eb, 0x10b981, 0xf59e0b, 0x64748b, 0xe11d48, 0x0ea5e9];

    function createTrafficCar(colorHex) {
        const tGroup = new THREE.Group();
        const paint = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.4 });
        const tWheels = [];

        const chassis = new THREE.Mesh(new THREE.BoxGeometry(1.84, 0.56, 4.1), paint);
        chassis.position.y = 0.58;
        chassis.castShadow = true;
        tGroup.add(chassis);

        roof.position.set(0, 1.06, -0.2);

        const glass = new THREE.Mesh(new THREE.BoxGeometry(1.56, 0.38, 1.9), darkGlass);
        glass.position.set(0, 1.04, -0.2);

        const fLight = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.12, 0.08), headLightMat);
        const fLightR = fLight.clone();
        fLight.position.set(0.62, 0.65, 2.06);
        fLightR.position.set(-0.62, 0.65, 2.06);

        const rLight = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.14, 0.08), tailLightMat);
        const rLightR = rLight.clone();
        rLight.position.set(0.62, 0.72, -2.06);
        rLightR.position.set(-0.62, 0.72, -2.06);
        tGroup.add(fLight, fLightR, rLight, rLightR);

        createWheel(0.85, 0.34, 1.25, false, tGroup, tWheels);
        createWheel(-0.85, 0.34, 1.25, false, tGroup, tWheels);
        createWheel(0.85, 0.34, -1.25, false, tGroup, tWheels);
        createWheel(-0.85, 0.34, -1.25, false, tGroup, tWheels);

        scene.add(tGroup);
        return { mesh: tGroup, wheels: tWheels, bumpX: 0, bumpZ: 0 };
    }

    function spawnTrafficCar(tCar, idx) {
        const alongZ = idx % 2 === 0;
        const dir = idx % 4 < 2 ? 1 : -1;
        const laneOffset = dir > 0 ? 3.8 : -3.8;

        const baseGridX = Math.round(car.position.x / TILE_SIZE) * TILE_SIZE;
        const baseGridZ = Math.round(car.position.z / TILE_SIZE) * TILE_SIZE;
        const spread = ((idx % 3) - 1) * TILE_SIZE;

        if (alongZ) {
            tCar.mesh.position.set(baseGridX + spread + laneOffset, 0, car.position.z + dir * (45 + (idx % 3) * 35));
            tCar.mesh.rotation.y = dir > 0 ? 0 : Math.PI;
            tCar.axis = 'z';
        } else {
            tCar.mesh.position.set(car.position.x + dir * (45 + (idx % 3) * 35), 0, baseGridZ + spread + laneOffset);
            tCar.mesh.rotation.y = dir > 0 ? Math.PI / 2 : -Math.PI / 2;
            tCar.axis = 'x';
        }
        tCar.dir = dir;
        tCar.speed = 0.36 + (idx % 3) * 0.08;
        tCar.bumpX = 0;
        tCar.bumpZ = 0;
    }

    for (let i = 0; i < 6; i++) {
        const tCar = createTrafficCar(trafficColors[i % trafficColors.length]);
        spawnTrafficCar(tCar, i);
        trafficCars.push(tCar);
    }

    // 6. التحكم والفيزياء والتصادم
    const keys = { up: false, down: false, left: false, right: false, brake: false };
    let speed = 0;
    let steeringAngle = 0;
    let bodyRoll = 0;
    const maxSpeed = 1.5;
    const maxReverse = -0.52;
    const accel = 0.024;
    const friction = 0.012;
    const brakeForce = 0.055;
    let lightsOn = true;
    let isDay = false;
    let cameraMode = 0;
    let collisionCount = 0;
    let statusTimeout = 0;

    const collisionStatusEl = document.getElementById('collision-status');
    const signalStatusEl = document.getElementById('signal-status');

    function notifyCollision(label) {
        collisionCount++;
        collisionStatusEl.textContent = `تصادم مع ${label} (المجموع: ${collisionCount})`;
        statusTimeout = 110;
    }

    window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'arrowup' || k === 'w') keys.up = true;
        if (k === 'arrowdown' || k === 's') keys.down = true;
        if (k === 'arrowleft' || k === 'a') keys.left = true;
        if (k === 'arrowright' || k === 'd') keys.right = true;
        if (e.code === 'Space') keys.brake = true;
        if (k === 'l') toggleLights();
        if (k === 'c') switchCamera();
    });

    window.addEventListener('keyup', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'arrowup' || k === 'w') keys.up = false;
        if (k === 'arrowdown' || k === 's') keys.down = false;
        if (k === 'arrowleft' || k === 'a') keys.left = false;
        if (k === 'arrowright' || k === 'd') keys.right = false;
        if (e.code === 'Space') keys.brake = false;
    });

    function bindTouch(id, prop) {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[prop] = true; });
        el.addEventListener('touchend', (e) => { e.preventDefault(); keys[prop] = false; });
    }
    bindTouch('btn-up', 'up');
    bindTouch('btn-down', 'down');
    bindTouch('btn-left', 'left');
    bindTouch('btn-right', 'right');

    function toggleLights() {
        lightsOn = !lightsOn;
        spotLightL.visible = lightsOn;
        spotLightR.visible = lightsOn;
        headLightMat.emissiveIntensity = lightsOn ? 2.0 : 0.05;
        const btn = document.getElementById('btn-lights');
        btn.textContent = lightsOn ? 'المصابيح: تشغيل' : 'المصابيح: إيقاف';
        btn.classList.toggle('active', lightsOn);
    }

    function toggleDayNight() {
        isDay = !isDay;
        const btn = document.getElementById('btn-time');
        if (isDay) {
            scene.background = new THREE.Color(dayBg);
            scene.fog = new THREE.FogExp2(0xbae6fd, 0.0022);
            ambientLight.color.setHex(0xffffff);
            ambientLight.intensity = 1.25;
            dirLight.color.setHex(0xfffbeb);
            dirLight.intensity = 1.4;
            ground.material.color.setHex(0x475569);
            asphaltMat.color.setHex(0x27303f);
            buildingWindows.forEach(w => {
                w.mesh.material = darkWindowMat;
            });

            dirLight.color.setHex(0xe2e8f0);
            dirLight.intensity = 0.95;
            ground.material.color.setHex(0x0b101b);
            asphaltMat.color.setHex(0x1e2430);
            buildingWindows.forEach(w => {
                w.mesh.material = w.isLit ? litWindowMat : darkWindowMat;
            });
            btn.textContent = 'الوضع: ليلي';

    function switchCamera() {
        cameraMode = (cameraMode + 1) % 3;
    }

    function resetCar() {
        car.position.set(3.8, 0, -25);
        car.rotation.set(0, 0, 0);
        carBodyGroup.rotation.set(0, 0, 0);
        speed = 0;
        steeringAngle = 0;
        bodyRoll = 0;
    }

    resetCar();

    function updateInfiniteCity() {
        const currentTileX = Math.round(car.position.x / TILE_SIZE);
        const currentTileZ = Math.round(car.position.z / TILE_SIZE);

        ground.position.x = car.position.x;
        ground.position.z = car.position.z;

        dirLight.position.set(car.position.x + 50, 90, car.position.z + 40);
        dirLight.target.position.copy(car.position);

        cityTiles.forEach(tileObj => {
            let dx = tileObj.gx - currentTileX;
            let dz = tileObj.gz - currentTileZ;

            if (dx > GRID_RADIUS) tileObj.gx -= (GRID_RADIUS * 2 + 1);
            if (dx < -GRID_RADIUS) tileObj.gx += (GRID_RADIUS * 2 + 1);
            if (dz > GRID_RADIUS) tileObj.gz -= (GRID_RADIUS * 2 + 1);
            if (dz < -GRID_RADIUS) tileObj.gz += (GRID_RADIUS * 2 + 1);

            const tx = tileObj.gx * TILE_SIZE;
            const tz = tileObj.gz * TILE_SIZE;
            tileObj.mesh.position.set(tx, 0, tz);

            tileObj.localBuildings.forEach(b => {
                b.worldX = tx + b.localX;
                b.worldZ = tz + b.localZ;
            });
        });
    }

    function checkCollisions() {
        const carRadius = 1.75;

        for (let i = 0; i < buildingBoxes.length; i++) {
            const b = buildingBoxes[i];
            const closestX = Math.max(b.worldX - b.halfW, Math.min(car.position.x, b.worldX + b.halfW));
            const closestZ = Math.max(b.worldZ - b.halfD, Math.min(car.position.z, b.worldZ + b.halfD));

            const dx = car.position.x - closestX;
            const dz = car.position.z - closestZ;
            const distSq = dx * dx + dz * dz;

            if (distSq < carRadius * carRadius) {
                const dist = Math.sqrt(distSq) || 0.001;
                const nx = dx / dist;
                const nz = dz / dist;
                const overlap = carRadius - dist;

                car.position.x += nx * (overlap + 0.05);
                car.position.z += nz * (overlap + 0.05);

                if (Math.abs(speed) > 0.12) {
                    notifyCollision('عمارة');
                }
                speed = -speed * 0.25;
            }
        }

        for (let i = 0; i < trafficCars.length; i++) {
            const tCar = trafficCars[i];
            const dx = car.position.x - tCar.mesh.position.x;
            const dz = car.position.z - tCar.mesh.position.z;
            const dist = Math.sqrt(dx * dx + dz * dz);
            const minDist = 3.2;

            if (dist < minDist && dist > 0.001) {
                const nx = dx / dist;
                const nz = dz / dist;
                const overlap = minDist - dist;

                car.position.x += nx * (overlap * 0.6);
                car.position.z += nz * (overlap * 0.6);

                tCar.bumpX = -nx * (0.35 + Math.abs(speed) * 0.5);
                tCar.bumpZ = -nz * (0.35 + Math.abs(speed) * 0.5);

                if (Math.abs(speed) > 0.1) {
                    notifyCollision('سيارة');
                }
                speed = -speed * 0.35;
            }
        }

        const carWorldPos = new THREE.Vector3();
        for (let i = 0; i < pedestrians.length; i++) {
            const p = pedestrians[i];
            p.mesh.getWorldPosition(carWorldPos);

            const dx = carWorldPos.x - car.position.x;
            const dz = carWorldPos.z - car.position.z;
            const dist = Math.sqrt(dx * dx + dz * dz);

            if (dist < 2.15 && Math.abs(speed) > 0.08 && p.hitTimer <= 0) {
                const nx = dx / (dist || 0.001);
                const nz = dz / (dist || 0.001);
                p.hitTimer = 55;
                p.knockX = nx * (0.28 + Math.abs(speed) * 0.35);
                p.knockZ = nz * (0.28 + Math.abs(speed) * 0.35);
                notifyCollision('شخص');
            }
        }
    }

    let elapsedTime = 0;
    function updateWorldAnimations() {
        elapsedTime += 0.016;

        if (statusTimeout > 0) {
            statusTimeout--;
            if (statusTimeout === 0) {
                collisionStatusEl.textContent = `إجمالي التصادمات: ${collisionCount}`;
            }
        }

        // دورة إشارات المرور (كل 10 ثوانٍ: 5ث أخضر/أحمر، ثم 1.5ث أصفر، ثم 3.5ث عكس)
        const cycleSec = elapsedTime % 10;
        let nsState = 'green'; // 'green' | 'yellow' | 'red'
        if (cycleSec < 5.0) {
            nsState = 'green';
        } else if (cycleSec < 6.5) {
            nsState = 'yellow';
        } else {
            nsState = 'red';
        }

        let ewState = 'red';
        if (cycleSec < 6.5) {
            ewState = 'red';
        } else if (cycleSec < 8.5) {
            ewState = 'green';
        } else {
            ewState = 'yellow';
        }

        trafficLightGroups.forEach(unit => {
            unit.signals.forEach(sig => {
                const state = sig.axis === 'z' ? nsState : ewState;
                sig.rBulb.material = state === 'red' ? unit.redOnMat : unit.redOffMat;
                sig.yBulb.material = state === 'yellow' ? unit.yellowOnMat : unit.yellowOffMat;
                sig.gBulb.material = state === 'green' ? unit.greenOnMat : unit.greenOffMat;
            });
        });

        // تحديث حالة الإشارة بالنسبة لاتجاه السيارة عند اقترابها من أقرب تقاطع
        const nearX = Math.round(car.position.x / TILE_SIZE) * TILE_SIZE;
        const nearZ = Math.round(car.position.z / TILE_SIZE) * TILE_SIZE;
        const distToCenter = Math.hypot(car.position.x - nearX, car.position.z - nearZ);

        if (distToCenter < 28) {
            const movingAlongZ = Math.abs(Math.cos(car.rotation.y)) >= Math.abs(Math.sin(car.rotation.y));
            const activeState = movingAlongZ ? nsState : ewState;
            if (activeState === 'green') {
                signalStatusEl.textContent = 'إشارة التقاطع: خضراء (تقدّم)';
                signalStatusEl.style.color = '#4ade80';
            } else if (activeState === 'yellow') {
                signalStatusEl.textContent = 'إشارة التقاطع: صفراء (استعد للتوقف)';
                signalStatusEl.style.color = '#facc15';
            } else {
                signalStatusEl.textContent = 'إشارة التقاطع: حمراء (توقف)';
                signalStatusEl.style.color = '#f87171';
            }
        } else {
            signalStatusEl.textContent = 'إشارات المرور: نشطة في التقاطعات';
            signalStatusEl.style.color = '#94a3b8';
        }

        pedestrians.forEach(p => {
            if (p.hitTimer > 0) {
                p.hitTimer--;
                p.mesh.position.x += p.knockX;
                p.mesh.position.z += p.knockZ;
                p.knockX *= 0.88;
                p.knockZ *= 0.88;
                p.mesh.rotation.x = Math.min(Math.PI / 2.2, p.mesh.rotation.x + 0.18);
                p.mesh.position.y = 0.35;
                return;
            }

            p.mesh.rotation.x = 0;
            const cycle = elapsedTime * p.walkSpeed * 42 + p.phase;
            const offset = Math.sin(cycle) * p.range;
            const dirSign = Math.cos(cycle) >= 0 ? 1 : -1;
            const limbSwing = Math.sin(elapsedTime * 8.5 + p.phase) * 0.55;
            const verticalBob = Math.abs(Math.cos(elapsedTime * 8.5 + p.phase)) * 0.04;

            if (p.alongAxis) {
                p.mesh.position.x = p.baseX + offset;
                p.mesh.position.z = p.baseZ;
                p.mesh.rotation.y = dirSign > 0 ? Math.PI / 2 : -Math.PI / 2;
            } else {
                p.mesh.position.z = p.baseZ + offset;
                p.mesh.position.x = p.baseX;
                p.mesh.rotation.y = dirSign > 0 ? 0 : Math.PI;
            }

            p.mesh.position.y = 0.22 + verticalBob;
            p.leftLeg.rotation.x = limbSwing;
            p.rightLeg.rotation.x = -limbSwing;
            p.leftArm.rotation.x = -limbSwing * 0.75;
            p.rightArm.rotation.x = limbSwing * 0.75;
        });

        trafficCars.forEach((tCar, idx) => {
            if (tCar.axis === 'z') {
                tCar.mesh.position.z += tCar.dir * tCar.speed;
            } else {
                tCar.mesh.position.x += tCar.dir * tCar.speed;
            }

            tCar.mesh.position.x += tCar.bumpX;
            tCar.mesh.position.z += tCar.bumpZ;
            tCar.bumpX *= 0.85;
            tCar.bumpZ *= 0.85;

            tCar.wheels.forEach(w => {
                w.rotation.x += tCar.speed * 2.8;
            });

            const dist = tCar.mesh.position.distanceTo(car.position);
            if (dist > 145) {
                spawnTrafficCar(tCar, idx);
            }
        });
    }

    const speedDisplay = document.getElementById('speed-val');
    const steerDisplay = document.getElementById('steer-indicator');

    function animate() {
        requestAnimationFrame(animate);

        if (keys.up) {
            speed = Math.min(speed + accel, maxSpeed);
        } else if (keys.down) {
            speed = Math.max(speed - accel, maxReverse);
        } else {
            if (speed > 0) speed = Math.max(0, speed - friction);
            if (speed < 0) speed = Math.min(0, speed + friction);
        }

        const isReversing = speed < -0.02;
        reverseLightMat.emissiveIntensity = isReversing ? 2.5 : 0.0;

        if (keys.brake) {
            if (speed > 0) speed = Math.max(0, speed - brakeForce);
            if (speed < 0) speed = Math.min(0, speed + brakeForce);
            tailLightMat.emissiveIntensity = 3.5;
        } else {
            tailLightMat.emissiveIntensity = lightsOn ? 1.5 : 0.2;
        }

        const steerInput = (keys.left ? 1 : 0) - (keys.right ? 1 : 0);
        const maxSteerAngle = 0.52;
        steeringAngle += (steerInput * maxSteerAngle - steeringAngle) * 0.16;

        if (Math.abs(steeringAngle) < 0.03) {
            steerDisplay.textContent = 'المقود: مستقيم';
        } else if (steeringAngle > 0) {
            steerDisplay.textContent = 'المقود: انحناء لليسار ↖';
        } else {
            steerDisplay.textContent = 'المقود: انحناء لليمين ↗';
        }

        frontWheelPivots.forEach(pivot => {
            pivot.rotation.y = steeringAngle;
        });

        const speedFactor = Math.min(1, Math.abs(speed) / 0.25);
        const driftMultiplier = keys.brake ? 1.45 : 1.0;

        if (Math.abs(speed) > 0.001) {
            const turnDirection = speed >= 0 ? 1 : -1;
            car.rotation.y += steeringAngle * 0.055 * speedFactor * driftMultiplier * turnDirection;

            car.position.x += Math.sin(car.rotation.y) * speed;
            car.position.z += Math.cos(car.rotation.y) * speed;

            wheels.forEach(w => {
                w.rotation.x += speed * 2.8;
            });
        }

        const targetRoll = -steeringAngle * 0.14 * Math.min(1, Math.abs(speed) / 0.6);
        bodyRoll += (targetRoll - bodyRoll) * 0.15;
        carBodyGroup.rotation.z = bodyRoll;

        checkCollisions();

        speedDisplay.textContent = Math.round(Math.abs(speed) * 120);

        updateInfiniteCity();
        updateWorldAnimations();

        let camOffset;
        if (cameraMode === 0) {
            camOffset = new THREE.Vector3(0, 2.8, -6.5);
        } else if (cameraMode === 1) {
            camOffset = new THREE.Vector3(0, 1.55, 0.25);
        } else {
            camOffset = new THREE.Vector3(0, 14, -11);
        }

        camOffset.applyMatrix4(car.matrixWorld);
        camera.position.lerp(camOffset, 0.12);

        const lookTarget = new THREE.Vector3(0, 1.0, cameraMode === 1 ? 16 : 4.5);
        lookTarget.applyMatrix4(car.matrixWorld);
        camera.lookAt(lookTarget);

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>

</body>
</html>
